name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
      - name: Compilar
        run: |
          echo "=== Archivos del repositorio ==="
          find . -not -path './.git/*' -type f | head -60
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "NO SE ENCONTRO settings.gradle: faltan archivos en el repositorio"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyecto encontrado en: $DIR"
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: basefinder-jar
          path: out/*.jar
